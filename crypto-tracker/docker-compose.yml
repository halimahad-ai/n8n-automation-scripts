version: '3.8'

services:
  backend:
    build: ./backend
    container_name: crypto-tracker-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://crypto:crypto123@db:5432/crypto_tracker
      - REDIS_URL=redis://redis:6379/0
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      - db
      - redis
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: nginx:alpine
    container_name: crypto-tracker-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: crypto-tracker-db
    environment:
      - POSTGRES_USER=crypto
      - POSTGRES_PASSWORD=crypto123
      - POSTGRES_DB=crypto_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: crypto-tracker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
